name: oneoff-v3-bbox-cache-hotfix

on:
  push:
    branches:
      - feature/v3-sam3-production-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-sam3-production-v1
          fetch-depth: 0

      - name: Apply bbox cache reload hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path("r2v_data_v2/v3/subject_attributes.py")
          text = source.read_text(encoding="utf-8")
          old = "\n".join([
              "                    assert record.accepted_base_image_path is not None",
              "                    _validate_attribute_png(",
              "                        output_root,",
              "                        record.accepted_base_image_path,",
              "                        final_selection=record.final_selection or \"raw\",",
              "                    )",
              "",
          ])
          new = "\n".join([
              "                    if record.accepted_base_image_path is not None:",
              "                        _validate_attribute_png(",
              "                            output_root,",
              "                            record.accepted_base_image_path,",
              "                            final_selection=record.final_selection or \"raw\",",
              "                        )",
              "",
          ])
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"expected exactly one bbox cache validation block, found {count}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_v3_subject_attributes.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_bbox_selected_owner_artifact_is_restart_safe"
          if marker not in test_text:
              test_code = textwrap.dedent(r'''

              def test_bbox_selected_owner_artifact_is_restart_safe(tmp_path: Path) -> None:
                  output_root = tmp_path / "output"
                  mask = np.zeros((100, 100), dtype=bool)
                  mask[20:80, 20:80] = True
                  owner_candidate = _candidate(
                      "candidate_bbox",
                      slot=1,
                      source_frame_index=10,
                      mask=mask,
                  )
                  candidate = subject_attributes.PendingAttributeCandidate(
                      discovered=DiscoveredSubjectAttribute(
                          attribute_type="lower_clothing",
                          phrase="black trousers",
                          grounding_prompt="the black trousers worn by person 1",
                      ),
                      attribute_id="a1",
                      owner_entity_id="e1",
                      owner_candidate=owner_candidate,
                      attribute_mask=mask,
                      source_image=Image.new("RGB", (100, 100), "white"),
                      crop=Image.new("RGBA", (60, 60), (255, 255, 255, 255)),
                      raw_crop=Image.new("RGBA", (60, 60), (255, 255, 255, 255)),
                      geometry=_geometry(),
                  )
                  record = subject_attributes._accepted_record(
                      candidate,
                      output_root=output_root,
                      sample_id="clip-1",
                      owner_reference=_ready_reference("e1", source_frame_index=10),
                      review=_accepted_review("a1"),
                      final_selection="bbox",
                      completion_attempted=False,
                      completion_outcome="bbox_fallback_accepted",
                      crop_padding_ratio=0.08,
                  )
                  assert record.default_variant == "bbox"
                  assert record.accepted_base_image_path is None

                  artifact = OwnerEnrichmentArtifact(
                      sample_id="clip-1",
                      owner_entity_id="e1",
                      owner_is_human=True,
                      attribute_id_start=1,
                      owner_phrase="person 1",
                      owner_grounding_prompt="the person 1",
                      records=[record],
                      metrics=OwnerEnrichmentMetrics(
                          discovery_calls=1,
                          review_calls=1,
                          sam3_attempts=1,
                          discovered_by_type={"lower_clothing": 1},
                          accepted_attributes=1,
                          same_frame_accepted=1,
                          raw_attribute_review_accepted=1,
                          attribute_bbox_variants_materialized=1,
                          attribute_bbox_reviews_attempted=1,
                          attribute_bbox_fallback_attempts=1,
                          attribute_bbox_fallback_accepted=1,
                      ),
                  )
                  artifact_path = output_root / "owners" / "clip-1" / "e1.json"
                  artifact_path.parent.mkdir(parents=True)
                  write_json_atomic(artifact_path, artifact.model_dump(mode="json"))

                  assert subject_attributes._load_cached_owner_artifact(
                      artifact_path,
                      output_root=output_root,
                      sample_id="clip-1",
                      owner_entity_id="e1",
                      attribute_id_start=1,
                  ) == artifact
                  assert subject_attributes._load_durable_owner_artifact(
                      artifact_path,
                      output_root=output_root,
                      sample_id="clip-1",
                      owner_entity_id="e1",
                  ) == artifact
              ''')
              tests.write_text(test_text + test_code, encoding="utf-8")
          PY

          python -m compileall -q r2v_data_v2/v3/subject_attributes.py tests/test_v3_subject_attributes.py
          git diff --check

      - name: Commit hotfix and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-v3-bbox-cache-hotfix.yml
          git add r2v_data_v2/v3/subject_attributes.py tests/test_v3_subject_attributes.py
          git diff --cached --check
          git commit -m "fix(v3): allow bbox attribute cache reload"
          git push origin HEAD:feature/v3-sam3-production-v1
