<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RA2VA binding A/B review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#202527;font:14px/1.45 system-ui,sans-serif;letter-spacing:0}header,main{max-width:1480px;margin:auto;padding:18px 24px}header{border-bottom:1px solid #cdd2d5;background:#fff}h1{font-size:23px;margin:0 0 8px}h2{font-size:17px;margin:14px 0 8px}h3{font-size:14px;margin:10px 0}button,input,textarea{font:inherit}button{cursor:pointer;padding:8px 12px;border:1px solid #99a4a8;background:white;border-radius:4px;color:inherit}button:hover{background:#eaf4f1}button:disabled{opacity:.45;cursor:default}button.primary{background:#125c4b;color:white;border-color:#125c4b}.toolbar,.counts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar{margin-top:12px}.counts{font-size:13px;color:#526067}#position{font-variant-numeric:tabular-nums;min-width:90px}#error{color:#9c2424;white-space:pre-wrap}#clip{overflow-wrap:anywhere;margin:0 0 8px}section{margin:20px 0;border-top:1px solid #cdd2d5;padding-top:12px}.media{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1fr);gap:24px}video{width:100%;height:300px;background:#111;object-fit:contain}.refs{display:flex;gap:12px;overflow:auto;align-items:start}.refs figure{margin:0;flex:0 0 125px}.refs img{width:125px;height:140px;object-fit:contain;background:#e4e7e9}.refs figcaption{font-size:12px;overflow-wrap:anywhere}.subjects{font-size:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{border-bottom:1px solid #dbe0e2;text-align:left;padding:10px;vertical-align:top}th{background:#e9edef;font-weight:600}th:first-child{width:15%}td{width:42.5%;overflow-wrap:anywhere}.field{display:grid;grid-template-columns:155px 1fr;gap:5px}.field b{font-weight:500;color:#566268}.changed{background:#fff0bd;border-left:3px solid #bd861c;padding-left:5px;font-weight:600}.unmatched{font-weight:600;color:#845919}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 14px}.failure{border-left:3px solid #b44848;padding-left:12px}.badge{font-size:12px;border-bottom:2px solid #a97618;margin-left:10px}.labels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.labels label{display:block;cursor:pointer;padding:10px 0;border-bottom:2px solid #cdd2d5}.labels label:has(input:checked){border-color:#125c4b;background:#e3f1ed}.labels small{display:block;margin:5px 0 0 22px;font-size:12px;color:#526067}.labels input{accent-color:#125c4b}textarea{display:block;width:100%;height:70px;resize:vertical;border:1px solid #9ba6aa;border-radius:4px;padding:8px;margin-top:8px}details{margin:8px 0}summary{cursor:pointer;font-weight:500}#statistics pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}#empty{padding:20px}#review[hidden]{display:none}@media(max-width:760px){header,main{padding:12px}.media,.twocol{grid-template-columns:1fr;gap:10px}video{height:230px}.labels{grid-template-columns:1fr 1fr}.table-wrap table{min-width:660px}.field{grid-template-columns:140px 1fr}h1{font-size:20px}}
table{table-layout:fixed}td{width:auto}th:not(:first-child){width:42.5%}.field{grid-template-columns:150px minmax(0,1fr)}.field b{font-size:13px}
</style>
</head>
<body>
<header>
<h1>RA2VA speaker-binding A/B review</h1>
<div id="counts" class="counts"></div>
<details id="statistics"><summary>Descriptive statistics</summary><pre id="stats"></pre></details>
<div class="toolbar"><button id="previous">Previous</button><span id="position"></span><button id="next">Next</button><button id="unreviewed">Unreviewed next</button><button id="export" class="primary">Export review JSON</button><span id="saved"></span></div>
<div id="error" role="alert"></div>
</header>
<main id="review" hidden>
<h2 id="clip"></h2>
<div class="media"><video id="video" controls preload="metadata"></video><div><h3>SOURCE / frozen Visual context (not MiMo numbering)</h3><div class="refs" id="refs"></div><details><summary>Frozen pre-projection Subject interpretation</summary><div class="subjects" id="subjects"></div></details></div></div>
<section class="twocol"><div id="old-refs"></div><div id="new-refs"></div></section>
<section><h2>Speaker grounding <span id="inventory" class="badge"></span></h2><div class="table-wrap"><table><thead><tr><th>Segment</th><th>OLD / legacy LR-ASD</th><th>NEW / no-LR-ASD</th></tr></thead><tbody id="grounding"></tbody></table></div></section>
<section class="twocol"><div id="old"></div><div id="new"></div></section>
<section><h2>Human review</h2><div id="labels" class="labels"></div><label for="note">Optional note</label><textarea id="note"></textarea><button id="clear" style="margin-top:8px">Clear label</button></section>
</main>
<script>
"use strict";
const VERSION="r2v.h3.ra2va_binding_ab_review.1";
const $=id=>document.getElementById(id);
let data,index=0,reviews={},storageKey;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function mediaPath(path){if(!/^media\/[0-9a-f]{64}\.(mp4|webm|mov|png|jpg|jpeg|webp)$/.test(path))throw Error("Invalid review media path");return path;}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({fingerprint:data.review_fingerprint,reviews}));$("saved").textContent="Saved locally";}catch(e){$("error").textContent="Local save failed: "+e.message;}}
function current(){return data.cases[index];}
function updateReview(label){const uid=current().clip_uid;reviews[uid]={label,note:$("note").value};persist();renderLabels();}
function renderLabels(){const label=(reviews[current().clip_uid]||{}).label||null;for(const input of document.querySelectorAll("input[name=label]"))input.checked=input.value===label;$("position").textContent=`${index+1} / ${data.clip_count}`;$("saved").textContent=`${Object.values(reviews).filter(r=>r.label).length} reviewed`;}
function sideCell(row,changed){const cell=el("td");if(!row){cell.append(el("span","Unmatched: no segment in this run","unmatched"));return cell;}if(!row.grounding_present||!row.decision_present)cell.append(el("p","Incomplete frozen segment metadata","unmatched"));for(const key of ["primary_speaker_group","binding_status","entity_id","speech_presentation","evidence_codes"]){const line=el("div",undefined,"field");line.append(el("b",key),el("span",Array.isArray(row[key])?row[key].join(", "):String(row[key]??"null"),changed.includes(key)?"changed":""));cell.append(line);}return cell;}
function details(parent,title,text){const d=el("details");d.append(el("summary",title),el("div",text,"text"));parent.append(d);}
function actualContext(id,context,title){const host=$(id);host.replaceChildren(el("h2",title+" actual MiMo reference context"));if(!context.available){host.append(el("p",title+" actual MiMo reference context: unavailable"),el("p",context.reason));return;}const refs=el("div",undefined,"refs");for(const r of context.references){const f=el("figure"),im=el("img");im.src=mediaPath(r.media);im.alt=r.picture_label;f.append(im,el("figcaption",`${r.picture_label} / ${r.subject_labels.join(", ")}\nSource ${r.source_image_label} (index ${r.source_image_index})\n${r.kind}; entity: ${r.entity_id??"null"}; attribute: ${r.attribute_id??"null"} / ${r.attribute_type??"null"}; owner: ${r.owner_entity_id??"null"}`));refs.append(f);}host.append(refs,el("div",context.subjects.map(s=>`${s.subject_label}: ${s.entity_id||s.attribute_id||s.kind} / ${s.source_picture_labels.join(", ")}${s.owner_entity_id?" / owner: "+s.owner_entity_id:""}`).join("\n"),"subjects"));const selection=context.reference_selection;host.append(el("p","selected_source_image_indexes: "+JSON.stringify(selection.selected_source_image_indexes)));for(const r of selection.dropped_references)host.append(el("div",`Source Image ${r.source_image_index} / ${r.attribute_type||r.kind}(${r.owner_entity_id||r.entity_id||""}) DROPPED: ${r.drop_reason}`,"text"));for(const p of selection.face_promotions||[])host.append(el("div",`Source face Image ${p.source_image_index} promoted to entity ${p.entity_id}; replaced source person image indexes: ${JSON.stringify(p.replaced_source_image_indexes)}`,"text"));}
function caption(id,side,title){const host=$(id);host.replaceChildren(el("h2",title+" / "+side.status));if(side.status==="failed"){const failure=el("div",undefined,"failure");failure.append(el("strong",side.failure_code||"failed"),el("div",side.failure_reason||""),el("div","Model calls: "+side.model_call_count),el("pre",JSON.stringify(side.failure_issues,null,2),"text"));host.append(failure);}if(!side.annotation_present){host.append(el("p","No frozen annotation"));return;}host.append(el("h3","Dialogue / lead-ins"));for(const text of side.dialogue)host.append(el("div",text,"text"));if(!side.dialogue.length)host.append(el("p","No <d> blocks; inspect full caption."));details(host,"Full shot1_caption",side.shot1_caption);details(host,"Frozen summary",side.summary);}
function render(){const c=current();$("review").hidden=false;$("clip").textContent=c.clip_uid;$("video").src=mediaPath(c.target_video);$("refs").replaceChildren();for(const r of c.references){const f=el("figure"),im=el("img");im.src=mediaPath(r.media);im.alt=r.picture_label;f.append(im,el("figcaption",`SOURCE ${r.source_image_label} / ${r.picture_label} / ${r.kind}\nattribute: ${r.attribute_id??"null"} / ${r.attribute_type??"null"}; entity: ${r.entity_id??"null"}; owner: ${r.owner_entity_id??"null"}`));$("refs").append(f);}$("subjects").textContent=c.subjects.map(s=>`${s.subject_label}: ${s.entity_id||s.attribute_id||s.kind} / ${s.source_picture_labels.join(", ")}${s.owner_entity_id?" / owner: "+s.owner_entity_id:""}`).join("\n");$("inventory").textContent=c.segment_inventory_diff?"segment_inventory_diff = true":"";$("grounding").replaceChildren();for(const row of c.aligned_segments){const tr=el("tr");tr.append(el("td",row.segment_id),sideCell(row.old,row.changed_fields),sideCell(row.new,row.changed_fields));$("grounding").append(tr);}actualContext("old-refs",c.old_reference_context,"OLD");actualContext("new-refs",c.new_reference_context,"NEW");caption("old",c.old,"OLD");caption("new",c.new,"NEW");$("note").value=(reviews[c.clip_uid]||{}).note||"";$("previous").disabled=index===0;$("next").disabled=index===data.clip_count-1;renderLabels();}
function exported(){return {schema_version:VERSION,legacy_root:data.legacy_root,no_lrasd_root:data.no_lrasd_root,clip_count:data.clip_count,reviews:data.cases.map(c=>({clip_uid:c.clip_uid,label:(reviews[c.clip_uid]||{}).label||null,note:(reviews[c.clip_uid]||{}).note||""}))};}
$("previous").onclick=()=>{if(index>0){index--;render();}};$("next").onclick=()=>{if(index+1<data.clip_count){index++;render();}};
$("unreviewed").onclick=()=>{for(let step=1;step<=data.clip_count;step++){const i=(index+step)%data.clip_count;if(!(reviews[data.cases[i].clip_uid]||{}).label){index=i;render();return;}}$("saved").textContent="All clips reviewed";};
$("note").oninput=()=>updateReview((reviews[current().clip_uid]||{}).label||null);$("clear").onclick=()=>updateReview(null);
$("export").onclick=()=>{if(!data)return;const url=URL.createObjectURL(new Blob([JSON.stringify(exported(),null,2)],{type:"application/json"}));const a=el("a");a.href=url;a.download="ra2va_binding_ab_review.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.addEventListener("keydown",event=>{if(!data||/INPUT|TEXTAREA/.test(event.target.tagName)||event.ctrlKey||event.metaKey||event.altKey)return;const keys=Object.keys(data.labels);if(/^[1-5]$/.test(event.key)){event.preventDefault();updateReview(keys[Number(event.key)-1]);}});
async function start(){const response=await fetch("data.json",{cache:"no-store"});if(!response.ok)throw Error("Cannot load review data");data=await response.json();if(data.schema_version!==VERSION||data.cases.length!==data.clip_count)throw Error("Invalid review data");const order=["SAME","NEW_BETTER","NEW_WORSE","BOTH_WRONG","FORMAT_ONLY"];data.labels=Object.fromEntries(order.map(k=>[k,data.labels[k]]));$("counts").textContent=`${data.clip_count} clips | OLD ${data.summary.legacy_ready_count} ready / ${data.summary.legacy_failed_count} failed | NEW ${data.summary.no_lrasd_ready_count} ready / ${data.summary.no_lrasd_failed_count} failed`;$("stats").textContent=JSON.stringify(data.summary,null,2);storageKey=VERSION+":"+data.review_fingerprint;try{const raw=localStorage.getItem(storageKey);if(raw){const state=JSON.parse(raw),ids=new Set(data.cases.map(c=>c.clip_uid));if(state.fingerprint!==data.review_fingerprint||!state.reviews||Array.isArray(state.reviews))throw Error("Saved review differs");for(const [uid,r] of Object.entries(state.reviews)){if(!ids.has(uid)||!r||(r.label!==null&&!order.includes(r.label))||typeof r.note!=="string")throw Error("Invalid saved review");}reviews=state.reviews;}}catch(e){$("error").textContent=e.message;reviews={};}for(const [key,definition] of Object.entries(data.labels)){const label=el("label"),input=el("input");input.type="radio";input.name="label";input.value=key;input.onchange=()=>updateReview(key);label.append(input,el("strong",key),el("small",definition));$("labels").append(label);}render();}
start().catch(error=>{$("error").textContent=error.message;});
</script>
</body></html>
